[package]
name = "rubo_vision"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["opencv"]
opencv = ["dep:opencv", "dep:quircs", "dep:base64"]
hardware = ["dep:rppal"]

[dependencies]
async-trait = "0.1"
rubo_engine = { git = "https://github.com/haiziyao/RuboVision-Engine.git", branch = "engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

base64 = { version = "0.22", optional = true }
opencv = { version = "0.92", optional = true }
quircs = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22.1", optional = true }
