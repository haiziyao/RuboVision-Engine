[bindings]
timer_source = []

# UART source bindings.
# source_key 是二进制帧中的 CMD 字节。
[[bindings.uart_source]]
task_id = "uart_color_detect"
source_key = 1
device_id = "color_camera"
function_id = "color_detect"

[[bindings.uart_source]]
task_id = "uart_qr_detect"
source_key = 2
device_id = "qr_camera"
function_id = "qr_detect"

[[bindings.uart_source]]
task_id = "uart_cross_detect"
source_key = 3
device_id = "cross_camera"
function_id = "cross"

[[bindings.uart_source]]
task_id = "uart_black_ring_detect"
source_key = 4
device_id = "color_camera"
function_id = "black_ring_detect"

[[bindings.debug_source]]
task_id = "debug_color_detect"
source_key = "color"
device_id = "color_camera"
function_id = "color_detect"

[[bindings.debug_source]]
task_id = "debug_qr_detect"
source_key = "qr"
device_id = "qr_camera"
function_id = "qr_detect"

[[bindings.debug_source]]
task_id = "debug_cross_detect"
source_key = "cross"
device_id = "cross_camera"
function_id = "cross"

[[bindings.debug_source]]
task_id = "debug_black_ring_detect"
source_key = "ring"
device_id = "color_camera"
function_id = "black_ring_detect"

